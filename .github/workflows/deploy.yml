name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint and format check
        run: npm run check

      - name: Test
        run: npm run test:coverage

      - name: Azure login (OIDC)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve backend URL and API key by tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: resolve
        run: |
          BACKEND_HOSTNAME=$(az webapp list --resource-group fbarryRG --query "[?tags.composant=='backend'].defaultHostName" -o tsv)
          KEY_VAULT_NAME=$(az keyvault list --resource-group fbarryRG --query "[?tags.composant=='key-vault'].name" -o tsv)
          BACKEND_API_KEY=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name backend-api-key --query value -o tsv)
          echo "::add-mask::$BACKEND_API_KEY"
          sed -i "s|https://REPLACE_WITH_PROD_API_URL/api|https://${BACKEND_HOSTNAME}/api|" src/environments/environment.ts
          sed -i "s|__BACKEND_API_KEY__|${BACKEND_API_KEY}|" src/environments/environment.ts

          SWA_NAME=$(az staticwebapp list --resource-group fbarryRG --query "[?tags.composant=='frontend'].name" -o tsv)
          SWA_TOKEN=$(az staticwebapp secrets list --name "$SWA_NAME" --query "properties.apiKey" -o tsv)
          echo "::add-mask::$SWA_TOKEN"
          echo "swa_token=$SWA_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Build (production)
        run: npm run build:prod

      - name: Deploy to Azure Static Web Apps
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.resolve.outputs.swa_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "dist/azure-quiz-frontend/browser"
          output_location: ""
          skip_app_build: true