name: DAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build Docker image
        env:
          API_KEY: ci-dummy-key
        run: |
          docker build \
            --build-arg API_BASE_URL=https://example.invalid/api \
            --secret id=api_key,env=API_KEY \
            -t azure-quiz-frontend:dast .

      - name: Start app container
        run: |
          docker run -d --name frontend -p 8080:8080 azure-quiz-frontend:dast
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz && exit 0
            sleep 2
          done
          docker logs frontend
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: http://localhost:8080
          fail_action: true
          allow_issue_writing: false
          rules_file_name: '.zap/rules.tsv'

      - name: Publish ZAP report to job summary
        if: always()
        run: |
          cat report_md.md || echo "No ZAP report"